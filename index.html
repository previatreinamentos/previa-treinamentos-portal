<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Instrutor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b2219;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
    }

    .icon-container {
      width: 90px;
      height: 90px;
      background-color: #123d2f;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .icon-container img {
      width: 50px;
      height: 50px;
    }

    .logo-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .logo-title span {
      color: #ff5722;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a3c2b5;
      margin-bottom: 25px;
    }

    .badge-button {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
      cursor: pointer;
      text-transform: uppercase;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #a3c2b5;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-box {
      background-color: #e1eae7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }

    .input-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      color: #1a3831;
      font-weight: 600;
    }

    .input-box input::placeholder {
      color: #7a948c;
    }

    .btn-submit {
      width: 100%;
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 15px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .hint-text {
      font-size: 0.8rem;
      color: #a3c2b5;
      margin-top: 25px;
      line-height: 1.4;
    }

    .footer-text {
      font-size: 0.75rem;
      color: #5d7e73;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-container">
      <img id="APP_ICON" src="https://cdn-icons-png.flaticon.com/512/3652/3652191.png" alt="Ícone">
    </div>

    <h1 class="logo-title">
      <span id="TITULO_PARTE1">PREV</span><span id="TITULO_PARTE2">IA</span>
    </h1>
    <p class="subtitle" id="SUBTITULO">Bem Vindo a Autoescola Digital</p>

    <button class="badge-button" id="INSTRUCAO_LOGIN">PAINEL DO INSTRUTOR</button>

    <form onsubmit="return false;">
      <div class="form-group">
        <label>CPF</label>
        <div class="input-box" id="BOX_CPF">
          <input type="text" id="INPUT_CPF" placeholder="000.000.000-00">
        </div>
      </div>

      <div class="form-group">
        <label>SENHA</label>
        <div class="input-box" id="BOX_SENHA">
          <input type="password" id="INPUT_SENHA" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn-submit">
        ENTRAR <span>→</span>
      </button>
    </form>

    <p class="hint-text" id="DICA_SENHA">Dica: Por padrão, a sua senha são os 4 primeiros dígitos do seu CPF.</p>
    <p class="footer-text" id="RODAPE_TEXTO"></p>
  </div>

  <script>
    // Cole o link do seu Web App gerado no Apps Script aqui embaixo:
    const URL_WEBAPP = "SUA_URL_DO_APPS_SCRIPT_AQUI";

    async function carregarDados() {
      try {
        const response = await fetch(URL_WEBAPP + '?nocache=' + new Date().getTime());
        const data = await response.json();

        // Atualização de Textos
        if (data.TITULO_PARTE1) document.getElementById('TITULO_PARTE1').innerText = data.TITULO_PARTE1;
        if (data.TITULO_PARTE2) document.getElementById('TITULO_PARTE2').innerText = data.TITULO_PARTE2;
        if (data.SUBTITULO) document.getElementById('SUBTITULO').innerText = data.SUBTITULO;
        if (data.INSTRUCAO_LOGIN) document.getElementById('INSTRUCAO_LOGIN').innerText = data.INSTRUCAO_LOGIN;
        if (data.DICA_SENHA) document.getElementById('DICA_SENHA').innerText = data.DICA_SENHA;
        if (data.RODAPE_TEXTO) document.getElementById('RODAPE_TEXTO').innerText = data.RODAPE_TEXTO;

        // Atualização de Ícone
        if (data.URL_ICONE_APP) document.getElementById('APP_ICON').src = data.URL_ICONE_APP;

        // Atualização de Cores dos Inputs
        if (data.COR_INPUT_BG) {
          document.getElementById('BOX_CPF').style.backgroundColor = data.COR_INPUT_BG;
          document.getElementById('BOX_SENHA').style.backgroundColor = data.COR_INPUT_BG;
        }
        if (data.COR_INPUT_TEXTO) {
          document.getElementById('INPUT_CPF').style.color = data.COR_INPUT_TEXTO;
          document.getElementById('INPUT_SENHA').style.color = data.COR_INPUT_TEXTO;
        }

      } catch (error) {
        console.error("Erro ao sincronizar com a planilha:", error);
      }
    }

    window.onload = carregarDados;
  </script>
</body>
</html>
